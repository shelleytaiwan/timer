<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>計時器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EFE9DF; --card:#F8F4EC; --ink:#2B1D1A; --muted:#8C7B70; --line:#D6CCBD; --hl:#9A3F22;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans",sans-serif;
}
.home{
  position:absolute;left:20px;top:calc(env(safe-area-inset-top,0px) + 20px);
  color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;
  border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:2px;
  transition:transform .15s,box-shadow .15s,border-color .15s;
}
.home:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.home:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{
  flex:1;width:100%;max-width:950px;margin:0 auto;
  padding:72px 20px 48px;
  display:flex;flex-direction:column;justify-content:center;
}
h1{
  margin:0 0 clamp(34px,7vh,72px);text-align:center;
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:900;
  font-size:clamp(34px,5.6vw,56px);letter-spacing:.12em;line-height:1.2;
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.timer{
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:22px 20px;display:flex;flex-direction:column;gap:22px;text-align:center;
  transition:border-color .15s;
}
.timer.alert{border-color:var(--hl);animation:flash .6s steps(1) infinite}
@keyframes flash{50%{background:#EFE3D6}}
.timer h2{
  margin:0;font-family:"Noto Serif TC",serif;font-weight:700;
  font-size:clamp(20px,2.2vw,24px);letter-spacing:.08em;
}
.time{
  font-family:"Noto Sans TC",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;
  font-size:clamp(48px,7vw,68px);line-height:1;letter-spacing:.02em;
}
.time.danger{color:var(--hl)}
.bar{height:6px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left center}
.bar i.danger{background:var(--hl)}
.status{font-size:14px;letter-spacing:.12em;color:var(--muted);min-height:20px;font-weight:500}
.status.done{color:var(--hl)}
.setters{display:flex;justify-content:center;gap:14px}
.setter{display:flex;flex-direction:column;align-items:center;gap:8px}
.setter label{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.stepper{display:flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:2px}
.stepper button{
  width:34px;height:40px;border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:18px;font-weight:700;cursor:pointer;
}
.stepper button:hover{background:var(--line)}
.stepper input{
  width:42px;text-align:center;border:0;background:transparent;color:var(--ink);
  font-family:inherit;font-size:18px;font-weight:700;-moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:2px solid var(--ink);outline-offset:-2px}
.stepper input:disabled{color:var(--muted)}
.setters.off{opacity:.5}
.btns{display:flex;gap:10px;margin-top:auto}
.btn{
  flex:1;font-family:inherit;font-weight:700;font-size:clamp(17px,1.9vw,20px);
  border:1px solid var(--ink);border-radius:2px;padding:13px 6px;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn-go{background:var(--ink);color:var(--card)}
.btn-reset{background:var(--card);color:var(--ink)}
footer{text-align:center;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.06em;color:var(--muted)}
@media (max-width:900px){.time{font-size:clamp(44px,6.4vw,60px)}}
@media (max-width:640px){
  .grid{grid-template-columns:1fr}
  main{padding:72px 16px 36px}
  .time{font-size:56px}
}
@media (prefers-reduced-motion:reduce){
  .home,.btn{transition:none}
  .timer.alert{animation:none}
}
</style>
</head>
<body>
<a class="home" href="https://shelleytaiwan.github.io/learning-toolkits/">← 返回主頁</a>
<main>
  <h1>計時器</h1>
  <div class="grid" id="grid"></div>
</main>
<footer>Shelleytaiwan 製作 · 2027 · 請勿商用</footer>

<script>
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, vol){
  ensureAudio();
  const dur = 1, t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + .03);
  gain.gain.setValueAtTime(vol, t + dur - .1);
  gain.gain.linearRampToValueAtTime(0, t + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(t + dur);
}
const playStartBeep = () => beep(660, .3);   // 準備開始／繼續
const playLongBeep  = () => beep(880, .35);  // 時間到

const CONFIGS = [
  {title:'3 分鐘', min:3,  sec:0,  free:false},
  {title:'40 秒',  min:0,  sec:40, free:false},
  {title:'自由設定', min:5, sec:0,  free:true}
];

function fmt(sec){
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}

function makeTimer(cfg){
  const root = document.createElement('section');
  root.className = 'timer';
  root.innerHTML = `
    <h2>${cfg.title}</h2>
    <div class="time">00:00</div>
    <div class="bar"><i></i></div>
    <div class="status">尚未開始</div>
    ${cfg.free ? `
    <div class="setters">
      <div class="setter"><label>分鐘</label>
        <div class="stepper"><button type="button" data-a="mm">－</button><input type="number" class="in-m" value="${cfg.min}" min="0" max="99" inputmode="numeric"><button type="button" data-a="mp">＋</button></div></div>
      <div class="setter"><label>秒數</label>
        <div class="stepper"><button type="button" data-a="sm">－</button><input type="number" class="in-s" value="${cfg.sec}" min="0" max="59" inputmode="numeric"><button type="button" data-a="sp">＋</button></div></div>
    </div>` : ''}
    <div class="btns">
      <button class="btn btn-go" type="button">開始計時</button>
      <button class="btn btn-reset" type="button">重設</button>
    </div>`;

  const q = s => root.querySelector(s);
  const timeEl = q('.time'), bar = q('.bar i'), statusEl = q('.status');
  const goBtn = q('.btn-go'), resetBtn = q('.btn-reset');
  const inM = q('.in-m'), inS = q('.in-s'), setters = q('.setters');

  let total = cfg.min*60 + cfg.sec, remaining = total;
  let running = false, endAt = 0, iv = null, flashTimer = null;

  function render(){
    timeEl.textContent = fmt(remaining);
    bar.style.transform = `scaleX(${total > 0 ? remaining/total : 0})`;
    const danger = remaining <= 10 && remaining > 0 && total > 10;
    timeEl.classList.toggle('danger', danger);
    bar.classList.toggle('danger', danger);
  }
  function setLocked(lock){
    if(!cfg.free) return;
    inM.disabled = inS.disabled = lock;
    setters.classList.toggle('off', lock);
  }
  function readInputs(){
    const m = Math.max(0, Math.min(99, parseInt(inM.value || 0, 10) || 0));
    const s = Math.max(0, Math.min(59, parseInt(inS.value || 0, 10) || 0));
    inM.value = m; inS.value = s;
    total = remaining = m*60 + s;
    render();
  }
  function stopTick(){ clearInterval(iv); iv = null; }

  function tick(){
    remaining = Math.max(0, Math.ceil((endAt - Date.now())/1000));
    render();
    if(remaining <= 0) finish();
  }
  function start(){
    if(running) return;
    if(remaining <= 0){ if(cfg.free) readInputs(); else { remaining = total; render(); } }
    if(remaining <= 0) return;
    playStartBeep();
    root.classList.remove('alert');
    running = true;
    endAt = Date.now() + remaining*1000;
    goBtn.textContent = '暫停';
    statusEl.textContent = '倒數中…';
    statusEl.classList.remove('done');
    setLocked(true);
    iv = setInterval(tick, 200);
  }
  function pause(){
    running = false; stopTick();
    remaining = Math.max(0, Math.ceil((endAt - Date.now())/1000));
    render();
    goBtn.textContent = '繼續';
    statusEl.textContent = '已暫停';
  }
  function reset(){
    running = false; stopTick();
    clearTimeout(flashTimer); root.classList.remove('alert');
    goBtn.textContent = '開始計時';
    statusEl.textContent = '尚未開始';
    statusEl.classList.remove('done');
    setLocked(false);
    if(cfg.free) readInputs(); else { remaining = total; render(); }
  }
  function finish(){
    running = false; stopTick();
    goBtn.textContent = '開始計時';
    statusEl.textContent = '時間到！';
    statusEl.classList.add('done');
    setLocked(false);
    root.classList.add('alert');
    playLongBeep();
    flashTimer = setTimeout(() => root.classList.remove('alert'), 1100);
  }

  goBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);

  if(cfg.free){
    inM.addEventListener('change', readInputs);
    inS.addEventListener('change', readInputs);
    root.addEventListener('click', e => {
      const a = e.target.dataset && e.target.dataset.a;
      if(!a || running) return;
      if(a === 'mm') inM.value = Math.max(0, (+inM.value||0) - 1);
      if(a === 'mp') inM.value = Math.min(99, (+inM.value||0) + 1);
      if(a === 'sm') inS.value = Math.max(0, (+inS.value||0) - 1);
      if(a === 'sp') inS.value = Math.min(59, (+inS.value||0) + 1);
      readInputs();
    });
  }

  render();
  return root;
}

const grid = document.getElementById('grid');
CONFIGS.forEach(c => grid.appendChild(makeTimer(c)));
</script>
</body>
</html>
